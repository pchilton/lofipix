services:
  powersync:
    container_name: powersync
    image: journeyapps/powersync-service:1.28.1
    # host network: PowerSync binds 5677 directly, and 127.0.0.1:5634
    # (the API JWKS) is reachable without a docker network.
    network_mode: host
    restart: unless-stopped
    # powersync.env is read verbatim into the container — do NOT use
    # `environment:` with ${VAR} interpolation, which reads the shell/.env
    # instead of this file.
    env_file:
      - powersync.env
    volumes:
      # The image's entrypoint is `node service/lib/entry.js` with WorkingDir
      # /app, so config must be mounted at /app (the service reads
      # powersync.yaml from CWD). Do NOT override working_dir — the entrypoint
      # is a relative path and would break.
      - ./powersync.yaml:/app/powersync.yaml:ro
      - ./sync-config.yaml:/app/sync-config.yaml:ro