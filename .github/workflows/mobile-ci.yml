name: Mobile CI

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "packages/db/**"
      - "bun.lock"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    paths:
      - "mobile/**"
      - "packages/db/**"
      - "bun.lock"
      - ".github/workflows/mobile-ci.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: mobile
        run: bun run typecheck

      - name: Lint
        working-directory: mobile
        run: bun run lint

      - name: Test
        working-directory: mobile
        run: bun run test
