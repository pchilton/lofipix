name: Deploy to Google Play

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/mobile-android.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache-dependency-path: mobile/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Install Dependencies
        run: |
          cd mobile
          npm install

      - name: Decode Keystore
        run: |
          cd mobile/android/app
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      - name: Build Release Bundle (.aab)
        env:
          ANDROID_STORE_FILE: ${{ github.workspace }}/mobile/android/app/keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd mobile/android
          ./gradlew bundleRelease

      - name: Release artifact details
        working-directory: mobile/android/app/build/outputs/bundle/release
        run: |
          AAB=app-release.aab
          SIZE=$(stat -c '%s' "$AAB")
          BUILT=$(stat -c '%y' "$AAB")
          SHA256=$(sha256sum "$AAB" | cut -d ' ' -f1)
          echo "Release file: $AAB"
          echo "Size: $SIZE bytes ($(numfmt --to=iec --suffix=B "$SIZE"))"
          echo "Built: $BUILT"
          echo "SHA-256: $SHA256"
          cat output-metadata.json

      - name: Upload to Google Play (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.lofipix
          releaseFiles: mobile/android/app/build/outputs/bundle/release/app-release.aab
          tracks: internal
