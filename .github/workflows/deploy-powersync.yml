name: Deploy PowerSync

on:
  push:
    branches:
      - main
    paths:
      - "powersync/**"
      - ".github/workflows/deploy-powersync.yml"
  workflow_dispatch:

concurrency:
  group: deploy-powersync
  cancel-in-progress: false

env:
  DEPLOY_HOST: oceania.lofipix.app
  DEPLOY_USER: ubuntu
  REMOTE_DIR: /home/ubuntu/powersync

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Configure SSH
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Config
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            powersync/ \
            --exclude='powersync.env' \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_DIR/"

      - name: Compose Up and Verify
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_DIR"
          test -f powersync.env || { echo "powersync.env missing" >&2; exit 1; }
          docker compose pull
          docker compose up -d
          for _ in $(seq 1 20); do
            if curl -fsS --max-time 2 http://127.0.0.1:5677/probes/liveness >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "PowerSync health check failed after restart" >&2
          docker compose logs powersync --tail 50 >&2 || true
          exit 1
          REMOTE