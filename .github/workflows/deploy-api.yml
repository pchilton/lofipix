name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  DEPLOY_HOST: oceania.lofipix.app
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /var/www/oceania.lofipix.app

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck API
        working-directory: api
        run: bun run typecheck

      - name: Build Production Bundle
        working-directory: api
        run: bun run build

      - name: Configure SSH
        env:
          DEPLOY_PRIVATE_KEY: ${{ secrets.DEPLOY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload Bundle
        run: |
          set -euo pipefail
          rsync -az \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            api/dist/index.js \
            "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/index.js.new"

      - name: Activate Bundle and Restart API
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          test -f .env.oceania
          if [ -f index.js ]; then cp index.js index.js.previous; fi
          mv index.js.new index.js
          sudo systemctl restart lofipix-api
          REMOTE

      - name: Verify Health
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          for _ in $(seq 1 15); do
            if curl -fsS --max-time 2 http://127.0.0.1:5634/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "API health check failed after restart" >&2
          systemctl status lofipix-api --no-pager >&2 || true
          exit 1
          REMOTE
