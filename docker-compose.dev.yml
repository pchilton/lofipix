services:
  # Database Backend
  postgres:
    image: postgres:16-alpine
    container_name: lofipix-postgres-dev
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - lofipix_postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Temporal Orchestrator Core Engine
  temporal-server:
    image: temporalio/auto-setup:1.24.2
    container_name: lofipix-temporal-server-dev
    ports:
      - "7233:7233"
    environment:
      - DB=${TEMPORAL_DB}
      - DB_PORT=${POSTGRES_PORT}
      - POSTGRES_SEEDS=${POSTGRES_HOST}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PWD=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  # Object Storage (MinIO)
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: lofipix-minio-dev
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lofipix_minio_dev_data:/data
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_API_CORS_ALLOW_ORIGIN=${MINIO_API_CORS_ALLOW_ORIGIN}

volumes:
  lofipix_postgres_dev_data:
  lofipix_minio_dev_data:
